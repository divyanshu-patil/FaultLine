[project]
name = "faultline-api"
version = "0.1.0"
description = "FaultLine product API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<0.121",
  "uvicorn[standard]>=0.34,<0.40",
  "psycopg[binary,pool]>=3.2,<3.4",
  "pydantic>=2.9,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<0.29", "pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
testpaths = ["tests"]

[tool.ruff]
line-length = 160
