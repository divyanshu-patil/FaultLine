# Local full stack: Postgres + API + web. The worker/proxy run on the host (they spawn BuggyBeans child processes).
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: faultline
      POSTGRES_HOST_AUTH_METHOD: trust
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d faultline"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: { context: .., dockerfile: infra/api.Dockerfile }
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://postgres@db:5432/faultline
      PORT: "4000"
    depends_on: { db: { condition: service_healthy } }
    ports: ["4000:4000"]

  web:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter web build && pnpm --filter web start"
    environment:
      API_ORIGIN: http://api:4000
    volumes: ["..:/app"]
    depends_on: [api]
    ports: ["3000:3000"]
