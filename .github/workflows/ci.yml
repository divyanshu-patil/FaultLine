name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm vitest run
      - run: sh scripts/check-no-prod-host.sh
      - run: pnpm --filter web build

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_DB: faultline, POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d faultline"
          --health-interval 3s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/faultline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - working-directory: apps/api
        run: pip install -e ".[dev]"
      - working-directory: apps/api
        run: pytest -q
